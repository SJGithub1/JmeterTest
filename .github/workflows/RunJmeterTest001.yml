# This is a basic workflow to help you get started with Actions

name: JmeterTest001

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Job Name
  RunTest:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Run test
       # Step 1: Pull your JMeter script (.jmx) from the repository
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Create reports directory
        run: mkdir -p ./reports/html

      # Step 2: Run the JMeter performance test
      - name: Execute JMeter Test
        uses: QAInsights/PerfAction@v5.6.2
        with:
          test-plan-path: './testPlan.jmx'
          args: "-e -o ./reports/html/" # Optional: Adds extra debugging flags if needed

      # Step 3: Archive the results so you can download them later
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always() # Ensures reports upload even if performance assertions fail
        with:
          name: jmeter-performance-reports
          path: |
            result.jtl
            *.log

      # step 4: Upload HTML Report
      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-reports
          path: reports
          if-no-files-found: error
